version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: duster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/duster
      JWT_SECRET: dev-jwt-secret-at-least-32-characters-long
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-price_duster_standard_monthly}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AWS_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy

  stripe-cli:
    image: stripe/stripe-cli:latest
    command: listen --forward-to http://dashboard:3000/api/webhooks/stripe
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
    depends_on:
      - dashboard
    profiles:
      - dev

volumes:
  postgres_data:
